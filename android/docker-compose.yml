# docker-compose.yml — FixIt VN local development services
version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: fixit-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fixitdb
      POSTGRES_USER: fixit
      POSTGRES_PASSWORD: fixit123
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fixit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
